<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Study Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #ccc;
        }

        .login-box h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
        }

        .bottom a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🤖 Login</h1>

    <p>Welcome back to AI Study Assistant</p>

    <form action="/login" method="POST">

    <label>Email</label>
    <input type="email"
           name="email"
           placeholder="Enter your email"
           required>

    <label>Password</label>
    <input type="password"
           name="password"
           placeholder="Enter your password"
           required>

    <button type="submit">Login</button>

</form>

    <div class="bottom">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

    <a href="index.html" class="home">← Back to Home</a>

</div>

</body>
</html>
