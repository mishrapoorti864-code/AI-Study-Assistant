<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat - AI Study Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7ff;
        }

        /* Header */
        header {
            background: #4f46e5;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        /* Chat Container */
        .chat-container {
            width: 700px;
            max-width: 92%;
            height: 600px;
            margin: 35px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px #d5d5d5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Chat Header */
        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 20px;
        }

        .chat-header h2 {
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
        }

        /* Messages */
        #chatBox {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .bot-message,
        .user-message {
            max-width: 75%;
            padding: 12px 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .bot-message {
            background: #eef0ff;
            color: #333;
        }

        .user-message {
            background: #4f46e5;
            color: white;
            margin-left: auto;
        }

        /* Input Area */
        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .chat-input button {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .chat-input button:hover {
            background: #3730a3;
        }

        footer {
            text-align: center;
            background: #1f2937;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        🤖 AI Study Assistant
    </div>

    <a href="/dashboard">
        ← Dashboard
    </a>

</header>


<div class="chat-container">

    <div class="chat-header">
        <h2>💬 AI Study Assistant</h2>
        <p>Ask me anything about your studies!</p>
    </div>


    <!-- Chat Messages -->
    <div id="chatBox">

        <div class="bot-message">
            👋 Hello! I'm your AI Study Assistant.
            What would you like to learn today?
        </div>

    </div>


    <!-- Input Area -->
    <div class="chat-input">

        <input
            type="text"
            id="messageInput"
            placeholder="Ask your study question"
        >

        <button type="button" onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

async function sendMessage() {

    const input = document.getElementById("messageInput");
    const message = input.value.trim();

    if (!message) {
        return;
    }

    const chatBox = document.getElementById("chatBox");


    // User Message
    const userMessage = document.createElement("div");

    userMessage.className = "user-message";

    userMessage.innerText = message;

    chatBox.appendChild(userMessage);


    // Clear input
    input.value = "";


    // Thinking Message
    const loadingMessage = document.createElement("div");

    loadingMessage.className = "bot-message";

    loadingMessage.innerText = "Thinking...";

    chatBox.appendChild(loadingMessage);


    // Scroll down
    chatBox.scrollTop = chatBox.scrollHeight;


    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });


        const data = await response.json();


        // Remove Thinking...
        loadingMessage.remove();


        // AI Response
        const botMessage = document.createElement("div");

        botMessage.className = "bot-message";


        if (data.answer) {

            botMessage.innerText = data.answer;

        } else {

            botMessage.innerText =
                data.error || "Something went wrong.";

        }


        chatBox.appendChild(botMessage);


    } catch (error) {

        loadingMessage.innerText =
            "Unable to connect to AI server.";

        console.error(error);

    }


    // Scroll to bottom
    chatBox.scrollTop = chatBox.scrollHeight;

}


/* --------------------------------
   SEARCH TOPIC → AUTOMATIC AI CHAT
--------------------------------- */

window.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);

    const topic = params.get("topic");


    if (topic) {

        const input = document.getElementById("messageInput");


        input.value =
            "Please explain " + topic + " in simple language.";


        // Automatically send to AI
        sendMessage();

    }

});


/* --------------------------------
   ENTER KEY TO SEND
--------------------------------- */

document.getElementById("messageInput")
    .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    });

</script>


<!-- Dark / Light Mode -->
<script src="{{ url_for('static', filename='theme.js') }}"></script>

</body>
</html>
