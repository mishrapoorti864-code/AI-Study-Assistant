<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Subjects - AI Study Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7ff;
        }

        .subjects-container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #243b9b;
            font-weight: bold;
        }

        .subjects-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .subjects-title h1 {
            color: #243b9b;
            margin-bottom: 8px;
        }

        .subjects-title p {
            color: #666;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .subject-card {
            background: white;
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .subject-icon {
            font-size: 38px;
        }

        .subject-card h2 {
            color: #243b9b;
            margin: 12px 0;
        }

        .topic-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .topic-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .topic-btn {
            border: none;
            background: #eef2ff;
            color: #243b9b;

            padding: 8px 12px;

            border-radius: 18px;

            cursor: pointer;

            font-size: 13px;
        }

        .topic-btn:hover {
            background: #243b9b;
            color: white;
        }


        /* =========================
           POPUP
        ========================= */

        .popup-overlay {

            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.5);

            justify-content: center;
            align-items: center;

            z-index: 999;
        }

        .popup {

            background: white;

            width: 90%;
            max-width: 420px;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.2);
        }

        .popup h2 {

            color: #243b9b;

            margin-top: 0;
        }

        .popup p {

            color: #555;

            margin-bottom: 25px;
        }

        .action-btn {

            width: 100%;

            padding: 12px;

            margin: 7px 0;

            border: none;

            border-radius: 7px;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        .chat-btn {
            background: #243b9b;
        }

        .notes-btn {
            background: #198754;
        }

        .quiz-btn {
            background: #e67e22;
        }

        .close-btn {

            background: #777;

            width: 100%;

            padding: 10px;

            margin-top: 12px;

            border: none;

            border-radius: 7px;

            color: white;

            cursor: pointer;
        }


        /* =========================
           DARK MODE
        ========================= */

        body.dark {

            background: #121212;
            color: #eeeeee;

        }

        body.dark .subject-card {

            background: #1e1e1e;
            color: #eeeeee;

        }

        body.dark .subject-card h2,
        body.dark .subjects-title h1 {

            color: #8fa7ff;

        }

        body.dark .subjects-title p {

            color: #ccc;

        }

        body.dark .back-btn {

            color: #8fa7ff;

        }

        body.dark .topic-btn {

            background: #30395f;
            color: white;

        }

        body.dark .popup {

            background: #1e1e1e;
            color: white;

        }

        body.dark .popup h2 {

            color: #8fa7ff;

        }

        body.dark .popup p {

            color: #ccc;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .subjects-grid {

                grid-template-columns: repeat(2, 1fr);

            }

        }

        @media (max-width: 600px) {

            .subjects-grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<div class="subjects-container">


    <!-- BACK -->

    <a href="/dashboard"
       class="back-btn">

        ← Back to Dashboard

    </a>


    <!-- TITLE -->

    <div class="subjects-title">

        <h1>
            📚 My Subjects
        </h1>

        <p>
            Select a topic to start learning with AI
        </p>

    </div>


    <!-- SUBJECTS -->

    <div class="subjects-grid">


        {% for subject in subjects %}

        <div class="subject-card">


            <div class="subject-icon">
                {{ subject.icon }}
            </div>


            <h2>
                {{ subject.name }}
            </h2>


            <div class="topic-title">
                Topics:
            </div>


            <div class="topic-list">


                {% for topic in subject.topics %}

                <button
                    class="topic-btn"
                    onclick="selectTopic(
                        '{{ subject.name }}',
                        '{{ topic }}'
                    )">

                    {{ topic }}

                </button>

                {% endfor %}


            </div>


        </div>

        {% endfor %}


    </div>


</div>



<!-- =========================
     POPUP
========================= -->

<div id="popupOverlay"
     class="popup-overlay">


    <div class="popup">


        <h2>
            📚 <span id="selectedTopic"></span>
        </h2>


        <p>
            What would you like to do with this topic?
        </p>


        <!-- AI CHAT -->

        <button
            class="action-btn chat-btn"
            onclick="openChat()">

            🤖 Explain with AI Chat

        </button>


        <!-- NOTES -->

        <button
            class="action-btn notes-btn"
            onclick="openNotes()">

            📚 Generate Study Notes

        </button>


        <!-- QUIZ -->

        <button
            class="action-btn quiz-btn"
            onclick="openQuiz()">

            📝 Take Quiz

        </button>


        <!-- CLOSE -->

        <button
            class="close-btn"
            onclick="closePopup()">

            Cancel

        </button>


    </div>

</div>



<script>

    let selectedSubject = "";
    let selectedTopic = "";


    /* =========================
       SELECT TOPIC
    ========================= */

    function selectTopic(subject, topic) {

        selectedSubject = subject;
        selectedTopic = topic;

        document.getElementById(
            "selectedTopic"
        ).innerText = topic;

        document.getElementById(
            "popupOverlay"
        ).style.display = "flex";

    }


    /* =========================
       CLOSE POPUP
    ========================= */

    function closePopup() {

        document.getElementById(
            "popupOverlay"
        ).style.display = "none";

    }


    /* =========================
       AI CHAT
    ========================= */

    function openChat() {

        const subject =
            encodeURIComponent(selectedSubject);

        const topic =
            encodeURIComponent(selectedTopic);

        window.location.href =
            "/chat?subject=" +
            subject +
            "&topic=" +
            topic;

    }


    /* =========================
       NOTES
    ========================= */

    function openNotes() {

        const subject =
            encodeURIComponent(selectedSubject);

        const topic =
            encodeURIComponent(selectedTopic);

        window.location.href =
            "/notes?subject=" +
            subject +
            "&topic=" +
            topic;

    }


    /* =========================
       QUIZ
    ========================= */

    function openQuiz() {

        const subject =
            encodeURIComponent(selectedSubject);

        const topic =
            encodeURIComponent(selectedTopic);

        window.location.href =
            "/quiz?subject=" +
            subject +
            "&topic=" +
            topic;

    }


    /* =========================
       CLOSE WHEN CLICK OUTSIDE
    ========================= */

    document.getElementById(
        "popupOverlay"
    ).addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closePopup();

            }

        }
    );

</script>


<script src="{{ url_for('static', filename='theme.js') }}"></script>


</body>

</html>
