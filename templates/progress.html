<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Progress Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7ff;
        }

        /* ================= HEADER ================= */

        .header {
            background: #243b9b;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: #1a2d78;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #14225c;
        }

        /* ================= MAIN CONTAINER ================= */

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .title {
            color: #243b9b;
            margin-bottom: 8px;
        }

        /* ================= LOADING ================= */

        #loading {
            text-align: center;
            margin: 30px 0;
            color: #243b9b;
            font-weight: bold;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #243b9b;
            margin-bottom: 10px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        /* ================= PROGRESS ================= */

        .progress-card {
            background: white;
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .progress-card h3 {
            color: #243b9b;
            margin-top: 0;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #243b9b;
            transition: width 0.5s ease;
        }

        #progressText {
            font-weight: bold;
            margin-bottom: 0;
        }

        /* ================= TABLE ================= */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #243b9b;
            color: white;
        }

        td {
            background: white;
        }

        /* ================= QUIZ HISTORY ================= */

        .history-section {
            background: white;
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .history-section h2 {
            color: #243b9b;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th,
        .history-table td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .history-table th {
            background: #243b9b;
            color: white;
        }

        .history-table td {
            background: white;
        }

        /* ================= DARK MODE ================= */

        body.dark .stat-card,
        body.dark .progress-card,
        body.dark .history-section {
            background: #1e1e1e !important;
            color: white;
        }

        body.dark .title,
        body.dark .stat-card h3,
        body.dark .progress-card h3,
        body.dark .history-section h2 {
            color: #8ea2ff;
        }

        body.dark td,
        body.dark .history-table td {
            background: #1e1e1e;
            color: white;
            border-color: #555;
        }

        body.dark th,
        body.dark .history-table th {
            background: #243b9b;
            color: white;
        }

        body.dark .progress-bar {
            background: #444;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .back-btn {
                padding: 8px 12px;
                font-size: 14px;
            }

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .progress-card,
            .history-section {
                padding: 18px;
            }

            .history-section {
                overflow-x: auto;
            }

            .history-table {
                min-width: 650px;
            }

        }

    </style>

</head>


<body>

    <!-- ================= HEADER ================= -->

    <div class="header">

        <h1>🤖 AI Study Assistant</h1>

        <a href="/dashboard"
           class="back-btn">
            Dashboard
        </a>

    </div>


    <!-- ================= MAIN ================= -->

    <div class="container">

        <h2 class="title">
            📊 My Progress
        </h2>

        <p>
            Track your learning progress and quiz performance.
        </p>


        <!-- LOADING -->

        <div id="loading">
            Loading your progress...
        </div>


        <!-- ================= STATS ================= -->

        <div class="stats">

            <div class="stat-card">

                <h3>📝 Quizzes</h3>

                <div class="number"
                     id="totalQuizzes">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>🎯 Average Score</h3>

                <div class="number"
                     id="averageScore">
                    0%
                </div>

            </div>


            <div class="stat-card">

                <h3>📚 Topics</h3>

                <div class="number"
                     id="topics">
                    0
                </div>

            </div>

        </div>


        <!-- ================= OVERALL PROGRESS ================= -->

        <div class="progress-card">

            <h3>
                📈 Overall Progress
            </h3>

            <div class="progress-bar">

                <div class="progress-fill"
                     id="progressFill">
                </div>

            </div>

            <p id="progressText">
                0%
            </p>

        </div>


        <!-- ================= SUBJECT PERFORMANCE ================= -->

        <div class="progress-card">

            <h3>
                📚 Subject-wise Performance
            </h3>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Subject</th>
                            <th>Average Score</th>
                        </tr>

                    </thead>

                    <tbody id="subjectTable">

                    </tbody>

                </table>

            </div>

        </div>


        <!-- ================= QUIZ HISTORY ================= -->

        <div class="history-section">

            <h2>
                📚 Quiz History
            </h2>

            <div class="table-container">

                <div id="historyBox">

                    <p>
                        Loading quiz history...
                    </p>

                </div>

            </div>

        </div>

    </div>


    <!-- ================= THEME ================= -->

    <script src="{{ url_for('static', filename='theme.js') }}"></script>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* =========================================
           LOAD PROGRESS
        ========================================= */

        async function loadProgress() {

            try {

                const response =
                    await fetch("/api/progress");

                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Unable to load progress."
                    );

                }


                /* Total quizzes */

                document.getElementById(
                    "totalQuizzes"
                ).innerText =
                    data.total_quizzes;


                /* Average score */

                document.getElementById(
                    "averageScore"
                ).innerText =
                    data.average_score + "%";


                /* Topics */

                document.getElementById(
                    "topics"
                ).innerText =
                    data.topics;


                /* Overall progress */

                const progress =
                    Math.min(
                        Math.max(
                            Number(data.average_score) || 0,
                            0
                        ),
                        100
                    );


                document.getElementById(
                    "progressFill"
                ).style.width =
                    progress + "%";


                document.getElementById(
                    "progressText"
                ).innerText =
                    progress + "%";


                /* Subject table */

                const table =
                    document.getElementById(
                        "subjectTable"
                    );


                table.innerHTML = "";


                if (
                    !data.subjects ||
                    data.subjects.length === 0
                ) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="2">
                                📭 No quiz results yet.
                            </td>
                        </tr>
                    `;

                }

                else {

                    data.subjects.forEach(
                        function(item) {

                            table.innerHTML += `
                                <tr>

                                    <td>
                                        ${item.subject || "Unknown"}
                                    </td>

                                    <td>
                                        ${item.percentage || 0}%
                                    </td>

                                </tr>
                            `;

                        }
                    );

                }


                /* Hide loading */

                document.getElementById(
                    "loading"
                ).style.display = "none";


            }

            catch (error) {

                document.getElementById(
                    "loading"
                ).innerText =
                    "❌ Error: " +
                    error.message;

                console.error(
                    "Progress Error:",
                    error
                );

            }

        }


        /* =========================================
           LOAD QUIZ HISTORY
        ========================================= */

        async function loadQuizHistory() {

            const historyBox =
                document.getElementById(
                    "historyBox"
                );


            try {

                const response =
                    await fetch(
                        "/api/quiz-history"
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Unable to load quiz history."
                    );

                }


                /* No history */

                if (
                    !data.history ||
                    data.history.length === 0
                ) {

                    historyBox.innerHTML = `
                        <p>
                            📭 No quizzes attempted yet.
                        </p>
                    `;

                    return;

                }


                /* Create table */

                let html = `

                    <table class="history-table">

                        <thead>

                            <tr>
                                <th>Subject</th>
                                <th>Topic</th>
                                <th>Score</th>
                                <th>Percentage</th>
                                <th>Date</th>
                            </tr>

                        </thead>

                        <tbody>
                `;


                data.history.forEach(
                    function(item) {

                        html += `

                            <tr>

                                <td>
                                    ${item.subject || "Unknown"}
                                </td>

                                <td>
                                    ${item.topic || "Unknown"}
                                </td>

                                <td>
                                    ${item.score}/${item.total}
                                </td>

                                <td>
                                    ${item.percentage}%
                                </td>

                                <td>
                                    ${item.date || "-"}
                                </td>

                            </tr>

                        `;

                    }
                );


                html += `

                        </tbody>

                    </table>

                `;


                historyBox.innerHTML =
                    html;


            }

            catch (error) {

                historyBox.innerHTML = `
                    <p>
                        ❌ Unable to load quiz history.
                    </p>
                `;

                console.error(
                    "Quiz History Error:",
                    error
                );

            }

        }


        /* =========================================
           PAGE LOAD
        ========================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadProgress();

                loadQuizHistory();

            }
        );

    </script>

</body>

</html>
