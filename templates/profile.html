<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - AI Study Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7ff;
        }

        .header {
            background: #243b9b;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .dashboard-btn {
            background: white;
            color: #243b9b;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .profile-icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            background: #243b9b;
            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
        }

        h1 {
            text-align: center;
            color: #243b9b;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .info {
            border-bottom: 1px solid #ddd;
            padding: 16px 5px;
        }

        .label {
            font-weight: bold;
            color: #243b9b;
            margin-bottom: 5px;
        }

        .value {
            color: #333;
            font-size: 16px;
        }

        .logout {
            display: block;
            width: 100%;
            text-align: center;

            margin-top: 30px;

            background: #243b9b;
            color: white;

            padding: 12px;

            border-radius: 7px;
            text-decoration: none;
        }

        @media (max-width: 600px) {

            .header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 18px;
            }

            .container {
                margin: 25px auto;
            }

        }

    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <div class="header">

        <div class="logo">
            🤖 AI Study Assistant
        </div>

        <a href="/dashboard"
           class="dashboard-btn">
            Dashboard
        </a>

    </div>


    <div class="container">


        <div class="profile-card">


            <div class="profile-icon">
                👤
            </div>


            <h1>
                My Profile
            </h1>


            <p class="subtitle">
                Your student information
            </p>


            <div class="info">

                <div class="label">
                    👤 Full Name
                </div>

                <div class="value">
                    {{ name }}
                </div>

            </div>


            <div class="info">

                <div class="label">
                    📧 Email
                </div>

                <div class="value">
                    {{ email }}
                </div>

            </div>


            <div class="info">

                <div class="label">
                    🎓 Course
                </div>

                <div class="value">
                    {{ course }}
                </div>

            </div>


            <div class="info">

                <div class="label">
                    📅 Year
                </div>

                <div class="value">
                    {{ year }}
                </div>

            </div>


            <a href="/logout"
               class="logout">
                Logout
            </a>


        </div>

    </div>

    <script src="{{ url_for('static', filename='theme.js') }}"></script>


</body>

</html>
