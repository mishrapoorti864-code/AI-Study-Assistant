<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Notes Generator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7ff;
        }

        .header {
            background: #243b9b;
            color: white;
            padding: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: #1a2d78;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            color: #243b9b;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
        }

        button {
            margin-top: 22px;
            width: 100%;
            padding: 14px;

            background: #243b9b;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1a2d78;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;

            color: #243b9b;
            font-weight: bold;
        }

        #notesBox {
            display: none;
            margin-top: 30px;
            padding: 25px;

            background: #f8f9ff;

            border-left: 5px solid #243b9b;
            border-radius: 8px;

            line-height: 1.7;
        }

        #notesBox h2,
        #notesBox h3 {
            color: #243b9b;
        }

        code {
            background: #e8e8e8;
            padding: 3px 6px;
            border-radius: 4px;
        }


        /* =========================
           DARK MODE
        ========================= */

        body.dark {
            background: #121212;
            color: #eeeeee;
        }

        body.dark .card {
            background: #1e1e1e;
            color: #eeeeee;
        }

        body.dark h2 {
            color: #8fa7ff;
        }

        body.dark input,
        body.dark select {
            background: #252525;
            color: white;
            border-color: #555;
        }

        body.dark input::placeholder {
            color: #aaa;
        }

        body.dark #notesBox {
            background: #252b45;
            color: #eeeeee;
            border-left-color: #8fa7ff;
        }

        body.dark #notesBox h2,
        body.dark #notesBox h3 {
            color: #9db0ff;
        }

        body.dark code {
            background: #333;
            color: white;
        }

    </style>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>
            🤖 AI Study Assistant
        </h1>

        <a href="/dashboard"
           class="back-btn">

            Dashboard

        </a>

    </div>


    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">

        <div class="card">

            <h2>
                📚 AI Notes Generator
            </h2>

            <p>
                Enter a topic and let AI create easy,
                exam-friendly notes for you.
            </p>


            <!-- SUBJECT -->

            <label>
                Subject
            </label>

            <select id="subject">

                <option value="Computer Organization">
                    Computer Organization
                </option>

                <option value="Data Structures">
                    Data Structures
                </option>

                <option value="Digital Electronics">
                    Digital Electronics
                </option>

                <option value="C++ Programming">
                    C++ Programming
                </option>

                <option value="Database Management">
                    Database Management
                </option>

                <option value="Computer Networks">
                    Computer Networks
                </option>

            </select>


            <!-- TOPIC -->

            <label>
                Topic
            </label>

            <input
                type="text"
                id="topic"
                placeholder="Example: Full Subtractor"
            >


            <!-- GENERATE BUTTON -->

            <button onclick="generateNotes()">

                ✨ Generate Notes

            </button>


            <!-- LOADING -->

            <div id="loading">

                🤖 AI is generating your notes...

            </div>


            <!-- NOTES -->

            <div id="notesBox"></div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        // =================================
        // GET SUBJECT AND TOPIC FROM URL
        // =================================

        const params =
            new URLSearchParams(
                window.location.search
            );

        const urlSubject =
            params.get("subject");

        const urlTopic =
            params.get("topic");


        // Automatically select subject

        if (urlSubject) {

            const subjectSelect =
                document.getElementById("subject");

            const optionExists =
                Array.from(
                    subjectSelect.options
                ).some(
                    option =>
                    option.value === urlSubject
                );

            if (optionExists) {

                subjectSelect.value =
                    urlSubject;

            }

        }


        // Automatically fill topic

        if (urlTopic) {

            document.getElementById("topic").value =
                urlTopic;

        }


        // =================================
        // GENERATE NOTES
        // =================================

        async function generateNotes() {

            const topicInput =
                document.getElementById("topic");

            const subjectInput =
                document.getElementById("subject");

            const topic =
                topicInput.value.trim();

            const subject =
                subjectInput.value;


            const loading =
                document.getElementById("loading");

            const notesBox =
                document.getElementById("notesBox");


            if (!topic) {

                alert(
                    "Please enter a topic."
                );

                topicInput.focus();

                return;
            }


            loading.style.display =
                "block";

            notesBox.style.display =
                "none";


            try {

                const response =
                    await fetch(
                        "/api/notes",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                topic: topic,

                                subject: subject

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Something went wrong."
                    );

                }


                notesBox.innerHTML =
                    formatNotes(
                        data.notes
                    );

                notesBox.style.display =
                    "block";


            }

            catch (error) {

                notesBox.innerHTML =
                    "<strong>Error:</strong> " +
                    error.message;

                notesBox.style.display =
                    "block";

            }

            finally {

                loading.style.display =
                    "none";

            }

        }


        // =================================
        // FORMAT AI NOTES
        // =================================

        function formatNotes(text) {

            return text

                .replace(
                    /^### (.*$)/gim,
                    "<h3>$1</h3>"
                )

                .replace(
                    /^## (.*$)/gim,
                    "<h2>$1</h2>"
                )

                .replace(
                    /^# (.*$)/gim,
                    "<h2>$1</h2>"
                )

                .replace(
                    /\*\*(.*?)\*\*/g,
                    "<strong>$1</strong>"
                )

                .replace(
                    /`([^`]+)`/g,
                    "<code>$1</code>"
                )

                .replace(
                    /\n/g,
                    "<br>"
                );

        }

    </script>


    <!-- THEME -->

    <script src="{{ url_for('static', filename='theme.js') }}"></script>


</body>

</html>
